name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: chile_oef_test
          POSTGRES_USER: chile_oef
          POSTGRES_PASSWORD: chile_oef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chile_oef -d chile_oef_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CHILE_OEF_DATABASE_URL: postgresql+psycopg://chile_oef:chile_oef@localhost:5432/chile_oef_test
      CHILE_OEF_TEST_DATABASE_URL: postgresql+psycopg://chile_oef:chile_oef@localhost:5432/chile_oef_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --extra dev --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Test
        run: uv run pytest
